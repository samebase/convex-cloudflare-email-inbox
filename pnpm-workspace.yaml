  "@samebase/convex-hosting>zod": 4.6.7
  "hono@4.11.4": 4.13.14
  js-yaml: 5.5.0
  "lodash@4.17.21": 4.18.1
  nanoid: 6.0.2
  postcss: "^8.5.23"
  "proxy-addr@2.0.7": 2.0.8
  "seroval@<1.6.3": "^1.6.3"
  sharp: 0.35.5
  "source-map-js@1.2.1": 1.2.2
  "tinypool@2.1.0": 2.2.0
  undici: 8.12.3
  "valibot@1.2.0": 1.5.0
