# Runs the setup stack in alchemy.run.ts. Workers Builds keeps deploying the
# code on every push; this workflow only applies the setup around it: the
# Worker shell, the Builds link, the Convex project and keys, and the inbox
# wiring: the bridge secret, the Worker URL, the buckets, and the routing.
#
# Pull request: a plan, read-only, as a check. Push to main: a deploy. Both
# compare against the live providers (--detect-drift), so a deleted key or a
# changed setting is repaired, not only a changed run file. The state is
# Alchemy's Cloudflare state store.
name: infra

on:
  pull_request:
    paths:
      - alchemy.run.ts
      - apps/mail/cloudflare.config.ts
      - packages/convex-cloudflare-email-inbox/src/alchemy.ts
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/infra.yml
  push:
    branches: [main]
    paths:
      - alchemy.run.ts
      - apps/mail/cloudflare.config.ts
      - packages/convex-cloudflare-email-inbox/src/alchemy.ts
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/infra.yml
  workflow_dispatch:
    inputs:
      adopt:
        description: Adopt resources that exist but are not in state yet
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time. Up to 100 pending runs wait instead of replacing each
# other, so a pull request plan never drops a queued deploy.
concurrency:
  group: infra
  queue: max
  cancel-in-progress: false

env:
  CI: "true"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CONVEX_ACCESS_TOKEN: ${{ secrets.CONVEX_ACCESS_TOKEN }}
  # The stack reads the GitHub ids of this repository from the GitHub API.
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  plan:
    # Forks get no secrets, so the authenticated plan cannot run for them.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The stack imports EmailInbox from the built component package.
      - run: pnpm --filter @samebase/convex-cloudflare-email-inbox build
      - run: npx alchemy plan --stage prod --adopt --no-input --detailed
      # Read-only: reports resources that changed outside the stack.
      - run: npx alchemy drift --stage prod --no-input

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The stack imports EmailInbox from the built component package.
      - run: pnpm --filter @samebase/convex-cloudflare-email-inbox build
      - run: npx alchemy deploy --stage prod --yes --no-input --detect-drift ${{ inputs.adopt && '--adopt' || '' }}
