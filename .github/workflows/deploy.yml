name: Deploy

on:
  push: { branches: [main] }
permissions: { contents: read }
jobs:
  production:
    runs-on: ubuntu-latest
    environment: { name: production, url: "${{ steps.deploy.outputs.url }}" }
    concurrency: { group: production, queue: max }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with: { version: 12.16.1 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 26.x, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The push of the deploy switches the site, so the checks run before it. The check also
      # builds the two packages that the app imports.
      - run: pnpm run check
      - id: deploy
        uses: samebase/convex-hosting/actions/deploy@v1
        with: { deploy-key: "${{ secrets.CONVEX_DEPLOY_KEY }}", working-directory: apps/mail }
      # A new deployment has no Convex Auth keys. Existing keys stay.
      - working-directory: apps/mail
        env: { CONVEX_DEPLOY_KEY: "${{ secrets.CONVEX_DEPLOY_KEY }}" }
        run: node ./scripts/ensure-convex-auth.ts
