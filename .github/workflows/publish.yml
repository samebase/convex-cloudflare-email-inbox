# Publishes the two packages to npm after CI succeeds on main: the verified commit
# is checked out, stable versions only, and a package publishes only when its
# package.json version is not on npm yet, the same steps as the package releases of
# samebase/samebase. Uses npm trusted publishing (OIDC) for provenance: each
# package's trusted publisher on npmjs.com names this repository and this workflow
# file. No npm token is stored. The npm CLI does the OIDC exchange itself;
# JS-DevTools/npm-publish did not, and reported each new version as "already
# published" without a publish. The component publishes before the UI package,
# which peers on it.
name: Publish

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    name: publish
    if: >-
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Select stable releases
        id: release
        run: |
          publish=true
          for package in packages/convex-cloudflare-email-inbox packages/convex-cloudflare-email-inbox-ui; do
            version="$(node -p "require('./${package}/package.json').version")"
            if [[ "${version}" == *-* ]]; then
              echo "Skip prerelease version ${version} of ${package}."
              publish=false
            fi
          done
          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"

      - name: Setup pnpm
        if: steps.release.outputs.publish == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Install dependencies
        if: steps.release.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build packages
        if: steps.release.outputs.publish == 'true'
        run: |
          pnpm --filter @samebase/convex-cloudflare-email-inbox build
          pnpm --filter @samebase/convex-cloudflare-email-inbox-ui build

      # pnpm pack replaces workspace: and catalog: versions with real ones.
      - name: Publish the versions that are not on npm
        if: steps.release.outputs.publish == 'true'
        run: |
          for package in packages/convex-cloudflare-email-inbox packages/convex-cloudflare-email-inbox-ui; do
            tag="$(node -p "const p = require('./${package}/package.json'); p.name + '@' + p.version")"
            if npm view "${tag}" version >/dev/null 2>&1; then
              echo "${tag} is already on npm; nothing to publish"
              continue
            fi
            tarball="$(cd "${package}" && pnpm pack --pack-destination "${RUNNER_TEMP}" | tail -n 1)"
            npx --yes npm@11.21.0 publish "${tarball}" --access public --provenance --tag latest
          done
